name: Install Dotfiles

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  install:
    # Moonswing needs a running snapd, so use a VM rather than a job container.
    runs-on: ubuntu-26.04

    steps:
      - name: Use baseline APT packages
        # The miracle-wm PPA advertises amd64v3 but only publishes amd64 packages.
        run: |
          echo 'APT::Architecture-Variants "";' | \
            sudo tee /etc/apt/apt.conf.d/99zz-disable-architecture-variants

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            sudo git curl software-properties-common \
            snapd xvfb xauth dbus-x11

      - name: Wait for Snap readiness
        run: |
          sudo systemctl start snapd.socket
          sudo timeout 180 snap wait system seed.loaded

      - uses: actions/checkout@v4

      - name: Run install.sh
        run: xvfb-run --auto-servernum dbus-run-session -- bash install.sh --yes
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Verify miracle-wm installation
        run: |
          test "$(dpkg-query -W -f='${Status}' miracle-wm)" = "install ok installed"

      - name: Verify moonswing installation
        run: snap list moonswing
