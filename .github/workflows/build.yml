name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: config/miracle-wm/matts-config
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmircore-dev clang libclang-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Build
        run: cargo build --target wasm32-wasip1 --release

      # master publishes to the "nightly" tag; every other branch gets its own
      # "nightly-<branch>" tag (slashes replaced with dashes). install.sh uses
      # the same naming scheme to pick the right wasm for the checked-out branch.
      - name: Compute release tag
        id: tag
        run: |
          if [ "$GITHUB_REF_NAME" = "master" ]; then
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
            echo "name=Nightly Build" >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
            echo "name=Nightly Build ($GITHUB_REF_NAME)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: true
          files: config/miracle-wm/matts-config/target/wasm32-wasip1/release/matts_config.wasm
